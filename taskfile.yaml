version: "3"

silent: true

vars:
  # -------------------------------
  # Platform Configuration
  # -------------------------------

  # Path separator per OS.
  PS: '{{fromSlash "/"}}'

  # Cross-platform mkdir/rm helpers.
  RMRF: '{{if eq OS "windows"}}powershell.exe -Command "Remove-Item -Force -Recurse -ErrorAction SilentlyContinue -Path{{else}}rm -rf{{end}}'
  RMRF_END: '{{if eq OS "windows"}}; exit 0"{{end}}'
  MKDIR: '{{if eq OS "windows"}}powershell.exe -Command "New-Item -ItemType Directory -Force -Path{{else}}mkdir -p{{end}}'
  MKDIR_END: '{{if eq OS "windows"}} | Out-Null"{{end}}'

  # -------------------------------
  # Project Directories
  # -------------------------------

  # Local bin & temp dirs (kept in repo root).
  LOCAL_BIN: "{{.TASKFILE_DIR}}{{.PS}}bin"
  CMD_DIR: "{{.TASKFILE_DIR}}{{.PS}}cmd"

  # -------------------------------
  # Protobuf Toolchain Configuration
  # -------------------------------

  # Protocol Buffers compiler version (must be explicit version - protoc doesn't support 'latest' tag).
  PROTOC_VERSION: "36.2"
  # Release tag for Protocol Buffers compiler downloads.
  PROTOC_DOWNLOAD_TAG: "v{{.PROTOC_VERSION}}"

  # Protobuf Go generator version.
  PROTOC_GEN_GO_TAG: "v1.36.12"
  # gRPC Go generator version.
  PROTOC_GEN_GO_GRPC_TAG: "v1.6.2"

  # Platform-specific protoc zip filename.
  PROTOC_ZIP: 'protoc-{{.PROTOC_VERSION}}-{{if eq OS "windows"}}win64{{else if eq OS "darwin"}}{{if eq ARCH "arm64"}}osx-aarch_64{{else}}osx-x86_64{{end}}{{else}}{{if eq ARCH "arm64"}}linux-aarch_64{{else}}linux-x86_64{{end}}{{end}}.zip'
  # Full path to download protoc zip (different locations for Windows vs Unix).
  PROTOC_ZIP_FULL_PATH: '{{if eq OS "windows"}}{{.LOCAL_BIN}}{{.PS}}{{.PROTOC_ZIP}}{{else}}{{.PS}}tmp{{.PS}}{{.PROTOC_ZIP}}{{end}}'
  # URL to download protoc from GitHub releases.
  PROTOC_URL: "https://github.com/protocolbuffers/protobuf/releases/download/{{.PROTOC_DOWNLOAD_TAG}}/{{.PROTOC_ZIP}}"

  # Binary names and paths.
  PROTOC_BIN_BASE: "protoc{{exeExt}}"
  PROTOC_BIN: "{{.LOCAL_BIN}}{{.PS}}{{.PROTOC_BIN_BASE}}"
  # Temporary path where protoc binary is initially extracted.
  PROTOC_BIN_IN_ZIP: "{{.LOCAL_BIN}}{{.PS}}bin{{.PS}}{{.PROTOC_BIN_BASE}}"
  PROTOC_GEN_GO_BIN: "{{.LOCAL_BIN}}{{.PS}}protoc-gen-go{{exeExt}}"
  PROTOC_GEN_GO_GRPC_BIN: "{{.LOCAL_BIN}}{{.PS}}protoc-gen-go-grpc{{exeExt}}"

  # -------------------------------
  # Tool Versions
  # -------------------------------

  # Go imports tool version.
  GOIMPORTS_TAG: "v0.50.0"
  # Vulnerability scanner version.
  GOVULNCHECK_TAG: "v1.8.0"
  # Linting tool version.
  GOLANGCI_VERSION: "2.13.2"

  # -------------------------------
  # Tool Binaries
  # -------------------------------

  GOIMPORTS_BIN: "{{.LOCAL_BIN}}{{.PS}}goimports{{exeExt}}"
  GOLANGCI_BIN: "{{.LOCAL_BIN}}{{.PS}}golangci-lint{{exeExt}}"
  GOVULNCHECK_BIN: "{{.LOCAL_BIN}}{{.PS}}govulncheck{{exeExt}}"

  # -------------------------------
  # Version Detection
  # -------------------------------

  # Commands to check current versions of installed tools.
  PROTOC_VERSION_OUTPUT:
    sh: '"{{.PROTOC_BIN}}" --version 2> /dev/null || true'
  PROTOC_GEN_GO_VERSION_OUTPUT:
    sh: '"{{.PROTOC_GEN_GO_BIN}}" --version 2> /dev/null || true'
  PROTOC_GEN_GO_GRPC_VERSION_OUTPUT:
    sh: '"{{.PROTOC_GEN_GO_GRPC_BIN}}" --version 2> /dev/null || true'
  GOIMPORTS_VERSION_OUTPUT:
    sh: 'go version -m "{{.GOIMPORTS_BIN}}" 2> /dev/null || true'
  GOLANGCI_VERSION_OUTPUT:
    sh: '{{if eq OS "windows"}}powershell -Command "try { if (Test-Path ''{{.GOLANGCI_BIN}}'') { & ''{{.GOLANGCI_BIN}}'' version } } catch { }; exit 0"{{else}}"{{.GOLANGCI_BIN}}" version 2> /dev/null || true{{end}}'

  # Regex patterns to extract version numbers from tool outputs.
  PROTOC_CURRENT_TAG: '{{regexFind "[0-9]+.[0-9]+" .PROTOC_VERSION_OUTPUT}}'
  PROTOC_GEN_GO_CURRENT_TAG: '{{regexFind "v([0-9]+.){2}([0-9a-z])+" .PROTOC_GEN_GO_VERSION_OUTPUT}}'
  PROTOC_GEN_GO_GRPC_CURRENT_TAG: 'v{{regexFind "([0-9]+.){2}([0-9a-z])+" .PROTOC_GEN_GO_GRPC_VERSION_OUTPUT}}'
  GOIMPORTS_CURRENT_TAG: '{{regexFind "v([0-9]+.){2}([0-9a-z])+" (regexFind "golang.org/x/tools\tv([0-9]+.){2}([0-9a-z])+\t" .GOIMPORTS_VERSION_OUTPUT)}}'
  GOLANGCI_CURRENT_TAG: '{{regexFind "v([0-9]+.){2}([0-9a-z])+" (regexFind "version v([0-9]+.){2}([0-9a-z])+ " .GOLANGCI_VERSION_OUTPUT)}}'

  # -------------------------------
  # Configuration Files
  # -------------------------------

  GOLANGCI_CONFIG: ".golangci.yaml"

  # -------------------------------
  # Project Binaries
  # -------------------------------

  # List of binaries to build.
  BINARIES:
    - "alarm-button-off"
    - "alarm-button-on"
    - "alarm-checker"
    - "alarm-packager"
    - "alarm-server"
    - "alarm-updater"

  # -------------------------------
  # Version Detection and Injection
  # -------------------------------

tasks:
  # -------------------------------
  # Default & Help
  # -------------------------------

  default:
    cmds:
      - task -l

  # -------------------------------
  # Tool Installation
  # -------------------------------

  _ensure-bin:
    internal: true
    cmds:
      - '{{.MKDIR}} ''{{.LOCAL_BIN}}''{{.MKDIR_END}}'

  install-protoc:
    desc: "Install protoc compiler into ./bin"
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-protoc.ps1
        {{else}}
          bash scripts/install-protoc.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      PROTOC_CURRENT_TAG: "{{.PROTOC_CURRENT_TAG}}"
      PROTOC_VERSION: "{{.PROTOC_VERSION}}"
      PROTOC_ZIP: "{{.PROTOC_ZIP}}"
      PROTOC_URL: "{{.PROTOC_URL}}"
      PROTOC_ZIP_FULL_PATH: "{{.PROTOC_ZIP_FULL_PATH}}"
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      PROTOC_BIN: "{{.PROTOC_BIN}}"
      PROTOC_BIN_IN_ZIP: "{{.PROTOC_BIN_IN_ZIP}}"

  install-protoc-gen-go:
    desc: "Install protoc-gen-go plugin into ./bin"
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-protoc-gen-go.ps1
        {{else}}
          bash scripts/install-protoc-gen-go.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      PROTOC_GEN_GO_TAG: "{{.PROTOC_GEN_GO_TAG}}"
      PROTOC_GEN_GO_CURRENT_TAG: "{{.PROTOC_GEN_GO_CURRENT_TAG}}"

  install-protoc-gen-go-grpc:
    desc: "Install protoc-gen-go-grpc plugin into ./bin"
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-protoc-gen-go-grpc.ps1
        {{else}}
          bash scripts/install-protoc-gen-go-grpc.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      PROTOC_GEN_GO_GRPC_TAG: "{{.PROTOC_GEN_GO_GRPC_TAG}}"
      PROTOC_GEN_GO_GRPC_CURRENT_TAG: "{{.PROTOC_GEN_GO_GRPC_CURRENT_TAG}}"

  _install-goimports:
    internal: true
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-goimports.ps1
        {{else}}
          bash scripts/install-goimports.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      GOIMPORTS_TAG: "{{.GOIMPORTS_TAG}}"
      GOIMPORTS_CURRENT_TAG: "{{.GOIMPORTS_CURRENT_TAG}}"

  _install-govulncheck:
    internal: true
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-govulncheck.ps1
        {{else}}
          bash scripts/install-govulncheck.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      GOVULNCHECK_TAG: "{{.GOVULNCHECK_TAG}}"

  install-lint:
    desc: "Install golangci-lint into ./bin"
    deps: [_ensure-bin]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/install-golangci-lint.ps1
        {{else}}
          bash scripts/install-golangci-lint.sh
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"
      GOLANGCI_CURRENT_TAG: "{{.GOLANGCI_CURRENT_TAG}}"
      GOLANGCI_VERSION: "{{.GOLANGCI_VERSION}}"
      GOLANGCI_BIN: "{{.GOLANGCI_BIN}}"

  install-tools:
    desc: "Install all development tools (golangci-lint, protoc, generators, goimports, govulncheck)"
    deps: 
      - install-lint
      - install-protoc
      - install-protoc-gen-go
      - install-protoc-gen-go-grpc
      - _install-goimports
      - _install-govulncheck

  # -------------------------------
  # Git Hooks
  # -------------------------------

  install-githooks:
    desc: "Configure Git hooks for this repository"
    cmds:
      - |
        echo "Setting up Git hooks..."
        git config --local core.hooksPath .githooks
        {{if ne OS "windows"}}
          chmod +x .githooks/commit-msg
        {{end}}
        echo "Git hooks configured successfully!"
        echo "Commit messages must now start with: fix:, feat:, or major:"

  remove-githooks:
    desc: "Disable Git hooks for this repository"
    cmds:
      - |
        echo "Disabling Git hooks..."
        git config --local --unset core.hooksPath || echo "Hooks path was not set"
        echo "Git hooks disabled. You can now use any commit message format."

  # -------------------------------
  # Code Generation
  # -------------------------------

  generate-protobuf:
    desc: "Generate protobuf code and format"
    deps:
      - install-protoc
      - install-protoc-gen-go
      - install-protoc-gen-go-grpc
      - _install-goimports
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/generate-protobuf.ps1
        {{else}}
          bash scripts/generate-protobuf.sh
        {{end}}
    env:
      LOCAL_BIN: "{{.LOCAL_BIN}}"
      PROTOC_BIN: "{{.PROTOC_BIN}}"
      GOIMPORTS_BIN: "{{.GOIMPORTS_BIN}}"

  # -------------------------------
  # Code Quality
  # -------------------------------

  lint-fix:
    desc: "Run golangci-lint with --fix"
    deps: [install-lint]
    cmds:
      - '"{{.GOLANGCI_BIN}}" config verify'
      - '"{{.GOLANGCI_BIN}}" run --fix'

  lint:
    desc: "Run golangci-lint"
    deps: [install-lint]
    cmds:
      - '"{{.GOLANGCI_BIN}}" config verify'
      - '"{{.GOLANGCI_BIN}}" run'

  security:
    desc: "Run govulncheck over the full module"
    deps: [_install-govulncheck]
    cmds:
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/run-govulncheck.ps1
        {{else}}
          bash scripts/run-govulncheck.sh
        {{end}}
    env:
      GOVULNCHECK_BIN: "{{.GOVULNCHECK_BIN}}"

  # -------------------------------
  # Testing
  # -------------------------------

  test:
    desc: "Run unit tests"
    cmds:
      - go test -v ./...

  test-race:
    desc: "Run unit tests with race detector"
    cmds:
      - |
        {{if eq OS "windows"}}
          echo "Note: Race detector requires CGO. If this fails, install gcc (MinGW-w64) or use WSL."
          powershell.exe -Command "\$env:CGO_ENABLED = '1'; go test -race -v ./..."
        {{else}}
          go test -race -v ./...
        {{end}}
    env:
      CGO_ENABLED: "1"

  # -------------------------------
  # Build & Release
  # -------------------------------

  build:
    desc: "Build all project binaries with version injection"
    deps: [fetch-tags]
    cmds:
      - '{{.MKDIR}} ''{{.LOCAL_BIN}}''{{.MKDIR_END}}'
      - |
        {{if eq OS "windows"}}
          powershell.exe -ExecutionPolicy Bypass -File scripts/build-binaries.ps1 -LocalBin "{{.LOCAL_BIN}}" -CmdDir "{{.CMD_DIR}}" -TaskfileDir "{{.TASKFILE_DIR}}" -Binaries {{range $i, $binary := .BINARIES}}{{if $i}},{{end}}"{{$binary}}"{{end}}
        {{else}}
          bash scripts/build-binaries.sh "{{.LOCAL_BIN}}" "{{.CMD_DIR}}" "{{.TASKFILE_DIR}}" {{range .BINARIES}}"{{.}}" {{end}}
        {{end}}

  # -------------------------------
  # Cleanup
  # -------------------------------

  clean:
    desc: "Remove binaries and temporary files"
    cmds:
      - '{{.RMRF}} ''{{.LOCAL_BIN}}''{{.RMRF_END}}'

  # -------------------------------
  # Version Management
  # -------------------------------

  fetch-tags:
    desc: "Fetch tags from origin"
    cmds:
      - |
        echo "Fetching tags from origin..."
        git fetch --tags

  version-check:
    desc: "Check what the next version would be based on commits"
    deps: [fetch-tags]
    cmds:
      - |
        echo "Analyzing commits for version bump..."
        {{if eq OS "windows"}}
          powershell -ExecutionPolicy Bypass -File scripts/semver_next.ps1
        {{else}}
          bash scripts/semver_next.sh
        {{end}}
